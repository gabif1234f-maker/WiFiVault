<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFiVault - Lista de Registros</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background-color: #0f172a; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
        tr:hover { background-color: #24334d; }
        .btn-add { padding: 10px 16px; background: #10b981; color: #0f172a; text-decoration: none; font-weight: bold; border-radius: 6px; }
        .empty { padding: 30px; text-align: center; color: #64748b; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h2>📋 Base de Datos de Prueba</h2>
            <a href="index.html" class="btn-add">➕ Cargar Datos</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Dirección / Barrio</th>
                    <th>Configuración Guardada</th>
                </tr>
            </thead>
            <tbody id="tablaSimple">
                <tr><td colspan="3" class="empty">Conectando con Supabase Cloud...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const URL_SUPABASE = "https://uwefwdfjfnoknkkobnzn.supabase.co";
        const KEY_SUPABASE = "sb_publishable_XXjNw0LJ7HroXlhobY3vTg_l3ofqWMa";
        const clienteSupabase = supabase.createClient(URL_SUPABASE, KEY_SUPABASE);

        async function cargarTabla() {
            var cuerpoTabla = document.getElementById('tablaSimple');
            
            try {
                // Descarga directa sin filtros de tu tabla 'redes_wifi'
                const { data: filas, error } = await clienteSupabase.from('redes_wifi').select('*');
                
                if (error) {
                    cuerpoTabla.innerHTML = '<tr><td colspan="3" class="empty">Error de lectura del servidor.</td></tr>';
                    return;
                }

                if (!filas || filas.length === 0) {
                    cuerpoTabla.innerHTML = '<tr><td colspan="3" class="empty">La base de datos en la nube está activa pero vacía.</td></tr>';
                    return;
                }

                cuerpoTabla.innerHTML = "";

                filas.forEach(function(item) {
                    var tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: bold; color: #ffffff;">${item.nombre}</td>
                        <td style="color: #cbd5e1;">${item.ubicacion}</td>
                        <td style="font-family: monospace; color: #ccff00; background: #0f172a; padding: 10px; border-radius: 4px;">${item.password}</td>
                    `;
                    cuerpoTabla.appendChild(tr);
                });

            } catch (err) {
                cuerpoTabla.innerHTML = '<tr><td colspan="3" class="empty">Fallo crítico de red.</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', cargarTabla);
    </script>
</body>
</html>
