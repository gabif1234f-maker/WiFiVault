<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFiVault - Base de Datos Interactiva</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="app-layout large-layout">
        <!-- Barra de navegación superior -->
        <div class="top-nav">
            <div class="nav-brand">
                <span class="brand-icon">📊</span>
                <h1>WiFi<strong>Vault</strong> <span class="counter-badge" id="totalCounter">0 Redes</span></h1>
            </div>
            <a href="index.html" class="btn-nav btn-nav-accent">➕ Nuevo Registro</a>
        </div>

        <!-- Tabla y Controles -->
        <div class="main-card">
            <div class="controls-toolbar">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="inputBuscar" class="search-input" placeholder="Buscar cliente, dirección o barrio...">
                </div>
                <button id="btnExportar" class="btn-excel">📥 Exportar Planilla (.CSV)</button>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Dirección Asignada</th>
                            <th>Red (SSID)</th>
                            <th>Contraseña de Seguridad</th>
                            <th style="text-align: center; width: 160px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes">
                        <tr><td colspan="5" class="empty-msg" id="mensajeEstado">Cargando datos desde Supabase Cloud...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://uwefwdfjfnoknkkobnzn.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_XXjNw0LJ7HroXlhobY3vTg_l3ofqWMa";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function actualizarContador(total) {
            document.getElementById('totalCounter').innerText = total + (total === 1 ? " Red" : " Redes");
        }
        async function mostrarRegistros(filtro = "") {
            var tablaBody = document.getElementById('tablaClientes');
            var msgEstado = document.getElementById('mensajeEstado');
            
            const { data: listaClientes, error } = await supabaseClient.from('redes_wifi').select('*');
            if (error) {
                tablaBody.innerHTML = '<tr><td colspan="5" class="empty-msg">Error de conexión con Supabase Cloud.</td></tr>';
                return;
            }

            actualizarContador(listaClientes.length);

            var listaFiltrada = listaClientes.filter(function(cliente) {
                var n = cliente.nombre ? cliente.nombre.toLowerCase() : "";
                var u = cliente.ubicacion ? cliente.ubicacion.toLowerCase() : "";
                return n.includes(filtro.toLowerCase()) || u.includes(filtro.toLowerCase());
            });

            if (listaFiltrada.length === 0) {
                tablaBody.innerHTML = '<tr><td colspan="5" class="empty-msg">No se encontraron terminales registradas.</td></tr>';
                return;
            }

            tablaBody.innerHTML = "";

            listaFiltrada.forEach(function(cliente) {
                var fila = document.createElement('tr');
                fila.id = "fila-" + cliente.id;
                fila.innerHTML = `
                    <td><div class="client-name" id="label-nombre-${cliente.id}">${cliente.nombre}</div></td>
                    <td><div class="address-text" id="label-ubicacion-${cliente.id}">${cliente.ubicacion}</div></td>
                    <td><span class="badge-ssid" id="label-red-${cliente.id}">${cliente.red}</span></td>
                    <td>
                        <div class="password-container-row">
                            <!-- Contraseña oculta por defecto usando estilo especial -->
                            <span class="crypto-password password-hidden" id="label-password-${cliente.id}" data-real-pass="${cliente.password}">••••••••</span>
                            <button class="btn-copy btn-eye" data-id="${cliente.id}" title="Mostrar/Ocultar">👁️</button>
                            <button class="btn-copy" data-pass="${cliente.password}" title="Copiar">📋</button>
                        </div>
                    </td>
                    <td style="text-align: center;">
                        <div class="actions-container-row">
                            <button class="btn-edit" data-id="${cliente.id}">⚙️</button>
                            <button class="btn-delete" data-id="${cliente.id}">❌</button>
                        </div>
                    </td>
                `;
                tablaBody.appendChild(fila);
            });

            // ACCIÓN: MOSTRAR / OCULTAR CONTRASEÑA (CON EL OJO)
            document.querySelectorAll('.btn-eye').forEach(btn => {
                btn.addEventListener('click', function() {
                    var id = this.getAttribute('data-id');
                    var targetSpan = document.getElementById('label-password-' + id);
                    if (targetSpan.classList.contains('password-hidden')) {
                        targetSpan.innerText = targetSpan.getAttribute('data-real-pass');
                        targetSpan.classList.remove('password-hidden');
                        this.innerText = "🔒";
                    } else {
                        targetSpan.innerText = "••••••••";
                        targetSpan.classList.add('password-hidden');
                        this.innerText = "👁️";
                    }
                });
            });

            // ACCIÓN: COPIAR AL PORTAPAPELES
            document.querySelectorAll('.btn-copy:not(.btn-eye)').forEach(btn => {
                btn.addEventListener('click', function() {
                    var pass = this.getAttribute('data-pass');
                    var boton = this;
                    navigator.clipboard.writeText(pass).then(function() {
                        boton.innerText = "✅";
                        setTimeout(function() { boton.innerText = "📋"; }, 1500);
                    });
                });
            });

            // ACCIÓN: ACTIVAR EDICIÓN INLINE
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', function() {
                    var id = this.getAttribute('data-id');
                    activarEdicion(id);
                });
            });

            // ACCIÓN: ELIMINAR DE LA NUBE
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    var id = this.getAttribute('data-id');
                    eliminarRegistro(id);
                });
            });
        }

        function activarEdicion(id) {
            var lblNombre = document.getElementById('label-nombre-' + id);
            var lblUbicacion = document.getElementById('label-ubicacion-' + id);
            var lblRed = document.getElementById('label-red-' + id);
            var lblPassword = document.getElementById('label-password-' + id);
            var fila = document.getElementById('fila-' + id);

            var btnEdit = fila.querySelector('.btn-edit');
            var btnDel = fila.querySelector('.btn-delete');

            var passReal = lblPassword.getAttribute('data-real-pass') || lblPassword.innerText;

            lblNombre.innerHTML = `<input type="text" class="table-input" id="edit-nombre-${id}" value="${lblNombre.innerText}">`;
            lblUbicacion.innerHTML = `<input type="text" class="table-input" id="edit-ubicacion-${id}" value="${lblUbicacion.innerText}">`;
            lblRed.innerHTML = `<input type="text" class="table-input" id="edit-red-${id}" value="${lblRed.innerText}">`;
            
            var parentPass = lblPassword.parentElement;
            parentPass.innerHTML = `<input type="text" class="table-input password-field" id="edit-password-${id}" value="${passReal}">`;

            btnEdit.textContent = "¼";
            btnEdit.className = "btn-save-inline";
            
            var clonEdit = btnEdit.cloneNode(true);
            btnEdit.parentNode.replaceChild(clonEdit, btnEdit);
            clonEdit.addEventListener('click', function() { guardarEdicion(id); });

            btnDel.textContent = "↩️";
            btnDel.className = "btn-cancel-inline";
            var clonDel = btnDel.cloneNode(true);
            btnDel.parentNode.replaceChild(clonDel, btnDel);
            clonDel.addEventListener('click', function() { mostrarRegistros(document.getElementById('inputBuscar').value); });
        }

        async function guardarEdicion(id) {
            var valNombre = document.getElementById('edit-nombre-' + id).value.trim();
            var valUbicacion = document.getElementById('edit-ubicacion-' + id).value.trim();
            var valRed = document.getElementById('edit-red-' + id).value.trim();
            var valPassword = document.getElementById('edit-password-' + id).value;

            if (!valNombre || !valUbicacion || !valRed || !valPassword) {
                alert("Campos vacíos.");
                return;
            }

            const { error } = await supabaseClient.from('redes_wifi').update({
                nombre: valNombre,
                ubicacion: valUbicacion,
                red: valRed,
                password: valPassword
            }).eq('id', id);

            if (error) {
                alert("Error al actualizar.");
            } else {
                mostrarRegistros(document.getElementById('inputBuscar').value);
            }
        }

        async function eliminarRegistro(id) {
            if (confirm("¿Purgar este registro de Supabase Cloud?")) {
                await supabaseClient.from('redes_wifi').delete().eq('id', id);
                mostrarRegistros(document.getElementById('inputBuscar').value);
            }
        }

        document.getElementById('inputBuscar').addEventListener('input', function() {
            mostrarRegistros(this.value);
        });

        document.addEventListener('DOMContentLoaded', function() {
            mostrarRegistros();
        });
    </script>
</body>
</html>
