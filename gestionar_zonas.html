<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Administrar Zonas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor-formulario" style="max-width: 1050px; margin: 20px auto;">
        <a href="menu.html" class="btn-volver">⬅ Volver al Menú</a>
        <h2 style="text-align: center; margin-bottom: 25px;">⚙️ Configuración de Ubicaciones</h2>
        <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            
            <div style="background: #1a1d2e; padding: 20px; border-radius: 8px; border: 1px solid #24293e; flex: 1; min-width: 300px;">
                <h3 style="color: #00adb5; font-size: 18px;">➕ Registrar Nueva Localidad</h3>
                <form id="formNuevaLocalidad">
                    <div class="grupo-campo">
                        <input type="text" id="inputNombreLocalidad" placeholder="Ej. Pampa del Infierno" required>
                    </div>
                    <button type="submit" class="btn-enviar" style="background: #00adb5;">💾 Guardar Localidad</button>
                </form>
                <h4 style="margin-top: 20px; color: #00adb5; font-size: 13px; border-bottom: 1px solid #24293e; padding-bottom: 5px;">📋 Localidades Registradas</h4>
                <div id="listaAdminLocalidades" style="margin-top: 10px; max-height: 250px; overflow-y: auto;"></div>
            </div>
            <div style="background: #1a1d2e; padding: 20px; border-radius: 8px; border: 1px solid #24293e; flex: 1.4; min-width: 350px;">
                <h3 style="color: #ff9f43; font-size: 18px;">🏡 Registrar Barrio y sus Calles</h3>
                <form id="formNuevoBarrio">
                    <div class="grupo-campo">
                        <label>Seleccionar Localidad:</label>
                        <select id="selectLocalidadPadre" required>
                            <option value="">-- Cargando localidades... --</option>
                        </select>
                    </div>
                    <div class="grupo-campo">
                        <label>Nombre del Barrio:</label>
                        <input type="text" id="inputNombreBarrio" placeholder="Ej. Barrio Centro" required>
                    </div>
                    <div class="grupo-campo">
                        <label>Calles (Separadas por comas):</label>
                        <textarea id="inputCallesBarrio" rows="3" placeholder="Ej. Av. Alvear, Calle Belgrano, Resistencia" required></textarea>
                    </div>
                    <button type="submit" class="btn-enviar" style="background: #ff9f43;">💾 Guardar Barrio y Calles</button>
                </form>
                <h4 id="tituloAdminBarrios" style="margin-top: 20px; color: #ff9f43; font-size: 13px; border-bottom: 1px solid #24293e; padding-bottom: 5px;">📋 Barrios de la Localidad</h4>
                <div id="listaAdminBarrios" style="margin-top: 10px; max-height: 220px; overflow-y: auto;"></div>
            </div>

        </div>
    </div>
    <script src="conexion.js"></script>
</body>
</html>
