<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Administrar Zonas</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* Corrección de fondo transparente para los botones de edición rápida */
        .btn-mini-accion {
            background: transparent !important;
            border: none !important;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: transform 0.1s ease;
        }
        .btn-mini-accion:hover {
            transform: scale(1.25);
        }
    </style>
</head>
<body>
    <div class="contenedor-formulario" style="max-width: 1100px; margin: 20px auto;">
        <a href="menu.html" class="btn-volver">⬅ Volver al Menú</a>
        <h2 style="text-align: center; margin-bottom: 30px;">⚙️ Configuración de Ubicaciones</h2>
        <div style="display: flex; gap: 25px; flex-wrap: wrap; justify-content: center;">
            <!-- COLUMNA IZQUIERDA: LOCALIDADES -->
            <div style="background: #23233b; padding: 25px; border-radius: 8px; border: 1px solid #34345c; flex: 1; min-width: 320px; max-width: 450px;">
                <h3 style="margin-top: 0; color: #00adb5;">➕ Registrar Nueva Localidad</h3>
                <form id="formNuevaLocalidad">
                    <div class="grupo-campo">
                        <label for="inputNombreLocalidad">Nombre de la Localidad:</label>
                        <input type="text" id="inputNombreLocalidad" placeholder="Ej. Pampa del Infierno, Los Frentones..." required>
                    </div>
                    <button type="submit" class="btn-enviar" style="background: #00adb5;">💾 Registrar Localidad</button>
                </form>

                <h4 style="margin-top: 25px; color: #00adb5; font-size: 14px; border-bottom: 1px solid #34345c; padding-bottom: 5px;">📋 Administrar Localidades Guardadas</h4>
                <div id="listaAdminLocalidades" style="margin-top: 15px; max-height: 250px; overflow-y: auto;">
                    <p style="color: #aaa; font-size: 13px;">Cargando localidades...</p>
                </div>
            </div>
            <!-- COLUMNA DERECHA: BARRIOS Y CALLES -->
            <div style="background: #23233b; padding: 25px; border-radius: 8px; border: 1px solid #34345c; flex: 1.5; min-width: 350px; max-width: 600px;">
                <h3 style="margin-top: 0; color: #ff9f43;">🏡 Registrar Barrio y sus Calles</h3>
                <form id="formNuevoBarrio">
                    <div class="grupo-campo">
                        <label for="selectLocalidadPadre">Seleccionar Localidad:</label>
                        <select id="selectLocalidadPadre" required>
                            <option value="">-- Selecciona Localidad --</option>
                        </select>
                    </div>

                    <div class="grupo-campo">
                        <label for="inputNombreBarrio">Nombre del Barrio:</label>
                        <input type="text" id="inputNombreBarrio" placeholder="Ej. Barrio Centro, Sportivo..." required>
                    </div>

                    <div class="grupo-campo">
                        <label for="inputCallesBarrio">Calles pertenecientes (separadas por comas):</label>
                        <textarea id="inputCallesBarrio" rows="3" placeholder="Ej. Av. Alvear, 9 de Julio, Resistencia" style="width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #34345c; background: #161623; color: white; resize: vertical;" required></textarea>
                    </div>
                    <button type="submit" class="btn-enviar" style="background: #ff9f43;">💾 Guardar Barrio y Calles</button>
                </form>
                <h4 id="tituloAdminBarrios" style="margin-top: 25px; color: #ff9f43; font-size: 14px; border-bottom: 1px solid #34345c; padding-bottom: 5px;">📋 Administrar Barrios de la Localidad</h4>
                <div id="listaAdminBarrios" style="margin-top: 15px; max-height: 250px; overflow-y: auto;">
                    <p style="color: #aaa; font-size: 13px;">Selecciona una localidad arriba para visualizar sus barrios.</p>
                </div>
            </div>
        </div>
    </div>
    <script src="conexion.js"></script>
</body>
</html>
