<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Redes Guardadas</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e24; color: #ffffff; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; }
        .nav-bar { width: 100%; max-width: 700px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .nav-link { color: #00b0ff; text-decoration: none; font-weight: bold; font-size: 16px; }
        .nav-link:hover { text-decoration: underline; }
        .card { background-color: #2a2a35; padding: 25px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); width: 100%; max-width: 700px; }
        h2 { margin-top: 0; color: #00b0ff; text-align: center; margin-bottom: 20px; }
        
        .wifi-item { background-color: #1f1f26; padding: 18px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #00b0ff; display: flex; justify-content: space-between; align-items: center; }
        .wifi-info p { margin: 5px 0; }
        .client-name { font-size: 15px; color: #e0e0e0; font-weight: 500; text-transform: uppercase; background: #2a2a35; display: inline-block; padding: 2px 8px; border-radius: 4px; margin-bottom: 5px !important; }
        .wifi-name { font-weight: bold; font-size: 20px; color: #00b0ff; }
        .wifi-pass { font-family: monospace; color: #00e676; background: #2a2a35; padding: 4px 8px; border-radius: 4px; font-size: 16px; font-weight: bold; text-align: right; }
        .wifi-ubi-text { color: #aaaaaa; font-size: 14px; }
        .wifi-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
        .action-btn { border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; color: white; }
        .edit-btn { background-color: #0288d1; }
        .edit-btn:hover { background-color: #01579b; }
        .delete-btn { background-color: #e53935; }
        .delete-btn:hover { background-color: #b71c1c; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="menu.html" class="nav-link">⬅️ Volver al Menú</a>
    </div>

    <div class="card">
        <h2>Redes Almacenadas en la Nube</h2>
        <div id="listaContrasenas">
            <p style="text-align: center; color: #aaaaaa;">Conectando con la base de datos...</p>
        </div>
    </div>

    <script src="conexion.js"></script>
</body>
</html>
