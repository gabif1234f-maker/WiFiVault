<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Redes Registradas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor-formulario" style="max-width: 900px; margin: 20px auto;">
        <a href="menu.html" class="btn-volver">⬅ Volver al Menú</a>
        <h2>📂 Redes WI-FI Almacenadas</h2>

        <div class="barra-busqueda">
            <input type="text" id="buscarCliente" placeholder="🔍 Buscar por cliente...">
            <select id="filtrarLocalidad">
                <option value="">📍 Todas las localidades</option>
            </select>
            <input type="text" id="buscarBarrio" placeholder="🏡 Buscar por barrio...">
        </div>
        <div id="listaContrasenas">
            <p style="text-align: center; color: #aaaaaa;">Cargando registros...</p>
        </div>
        
        <!-- MODAL FLOTANTE DE EDICIÓN AVANZADA -->
        <div id="modalEditar" class="modal-oculto">
            <div class="modal-contenido">
                <span id="cerrarModal" class="btn-cerrar-modal">&times;</span>
                <h3>✏️ Editar Registro</h3>
                <form id="formEditarModal">
                    <input type="hidden" id="editIdDoc">
                    <div class="grupo-campo"><label>Cliente:</label><input type="text" id="editCliente" required></div>
                    <div class="grupo-campo"><label>SSID:</label><input type="text" id="editSsid" required></div>
                    <div class="grupo-campo"><label>Contraseña:</label><input type="text" id="editClave" required></div>
                    <div class="grupo-campo"><label>Ubicación:</label><input type="text" id="editUbicacion" required></div>
                    <button type="submit" class="btn-enviar" style="background: #00a8ff;">💾 Guardar Cambios</button>
                </form>
            </div>
        </div>

        <!-- MODAL FLOTANTE DEL MAPA EN VIVO -->
        <div id="modalMapa" class="modal-oculto">
            <div class="modal-contenido" style="max-width: 700px; width: 90%;">
                <span id="cerrarModalMapa" class="btn-cerrar-modal">&times;</span>
                <h3 id="tituloMapaCliente" style="margin-bottom: 15px;">🗺️ Ubicación del Cliente</h3>
                <div style="width: 100%; height: 400px; border-radius: 8px; overflow: hidden; border: 1px solid #32324d;">
                    <iframe id="iframeMapa" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script src="conexion.js"></script>
</body>
</html>
