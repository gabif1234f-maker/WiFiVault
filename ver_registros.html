<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Redes Registradas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor-formulario ancho-registros">
           <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <a href="menu.html" class="btn-volver">← Volver al Menú</a>
        
        <!-- LOGO CYBERPUNK INTEGRADO EN EL ENCABEZADO -->
        <div class="encabezado-logo-contenedor" style="display: flex; align-items: center; gap: 12px;">
            <div class="logo-cyber-nodo" style="width: 38px; height: 38px;">
                <svg viewBox="0 0 100 100" xmlns="http://w3.org">
                    <circle cx="50" cy="55" r="38" fill="none" stroke="rgba(255, 56, 56, 0.15)" stroke-width="2" stroke-dasharray="4 4" />
                    <path d="M25 38 A 30 30 0 0 1 75 38" fill="none" stroke="#ff3838" stroke-width="5" stroke-linecap="round" style="filter: drop-shadow(0 0 6px #ff3838); opacity: 0.9;" />
                    <path d="M33 46 A 20 20 0 0 1 67 46" fill="none" stroke="#ff3838" stroke-width="5" stroke-linecap="round" style="filter: drop-shadow(0 0 6px #ff3838); opacity: 0.9;" />
                    <line x1="50" y1="55" x2="50" y2="82" stroke="#787c99" stroke-width="3" stroke-linecap="round" opacity="0.8" />
                    <line x1="50" y1="68" x2="28" y2="78" stroke="#787c99" stroke-width="3" stroke-linecap="round" opacity="0.8" />
                    <line x1="50" y1="68" x2="72" y2="78" stroke="#787c99" stroke-width="3" stroke-linecap="round" opacity="0.8" />
                    <circle cx="50" cy="55" r="5" fill="#ffffff" style="filter: drop-shadow(0 0 8px #ff3838);" />
                    <circle cx="28" cy="78" r="4" fill="#ff3838" />
                    <circle cx="72" cy="78" r="4" fill="#ff3838" />
                    <circle cx="50" cy="82" r="4" fill="#ff3838" />
                </svg>
            </div>
            <h2 style="margin-bottom: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.5px; color: #ff3838;">Redes WI-FI Almacenadas</h2>
        </div>
    </div>


        <div class="barra-busqueda" style="width: 100%;">
            <input type="text" id="buscarCliente" placeholder="🔍 Buscar por cliente...">
            <select id="filtrarLocalidad"><option value="">📍 Todas las localidades</option></select>
            <input type="text" id="buscarBarrio" placeholder="🏡 Buscar por barrio...">
        </div>
        <!-- COLUMNA IZQUIERDA: TARJETAS DINÁMICAS DE REDES -->
        <div class="columna-lista" id="listaContrasenas">
            <p style="text-align: center; color: #787c99;">Cargando registros desde la nube...</p>
        </div>
        <!-- COLUMNA DERECHA: PANEL FIJO PARA EDICIÓN MANUAL DE COORDENADAS -->
        <!-- Busca tu formulario lateral derecho con id="formPanelFijoEdicion" y verifica que sus inputs tengan estos IDs -->
<div class="columna-panel-fijo">
    <h3>📝 Panel de Modificación Directa</h3>
    <form id="formPanelFijoEdicion">
        <!-- Input oculto para el ID del documento -->
        <input type="hidden" id="editIdDoc">

        <div class="grupo-campo">
            <label>Cliente:</label>
            <input type="text" id="editCliente" required>
        </div>


        <div class="grupo-campo">
            <label>Nombre WI-FI (SSID):</label>
            <input type="text" id="editSsid" required>
        </div>

        <div class="grupo-campo">
            <label>Contraseña:</label>
            <input type="text" id="editClave" required>
        </div>

        <div class="grupo-campo">
            <label>📍 Localidad:</label>
            <input type="text" id="editLocalidad" required>
        </div>

        <div class="grupo-campo">
            <label>🏡 Barrio:</label>
            <input type="text" id="editBarrio" required>
        </div>

        <div class="grupo-campo">
            <label>🛣️ Calle / Altura / Esquinas:</label>
            <input type="text" id="editCalle" required>
        </div>

        <div class="grupo-campo">
            <label>🌐 Latitud:</label>
            <input type="text" id="editLatitud">
        </div>

        <div class="grupo-campo">
            <label>🌐 Longitud:</label>
            <input type="text" id="editLongitud">
        </div>

        <button type="submit" class="btn-enviar">Guardar Cambios</button>
    </form>
</div>

        <!-- VENTANA FLOTANTE DEL MAPA EN VIVO -->
        <div id="modalMapa" class="modal-oculto">
            <div class="modal-contenido" style="max-width: 650px;">
                <span id="cerrarModalMapa" class="btn-cerrar-modal">&times;</span>
                <h3 id="tituloMapaCliente" style="margin-bottom: 12px; font-size: 16px;">🗺️ Ubicación</h3>
                <div style="width: 100%; height: 380px; border-radius: 8px; overflow: hidden; border: 1px solid #24293e;">
                    <iframe id="iframeMapa" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>

    </div>
    <script src="conexion.js"></script>
</body>
</html>
