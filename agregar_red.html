<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Agregar Red</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e24; color: #ffffff; margin: 0; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; min-height: 100vh; }
        .nav-bar { width: 100%; max-width: 500px; display: flex; justify-content: space-between; margin-bottom: 20px; }
        .nav-link { color: #00b0ff; text-decoration: none; font-weight: bold; font-size: 16px; }
        .nav-link:hover { text-decoration: underline; }
        .card { background-color: #2a2a35; padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); width: 100%; max-width: 500px; }
        h2 { margin-top: 0; color: #00b0ff; text-align: center; margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #bbbbbb; font-size: 14px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #444455; border-radius: 8px; background-color: #1f1f26; color: #ffffff; font-size: 15px; }
        input:focus, select:focus { border-color: #00b0ff; outline: none; }
        button { background-color: #00b0ff; color: #1e1e24; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 8px; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0081cb; color: white; }
        .nueva-loc-box { display: none; background-color: #15151a; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #00b0ff; }
    </style>
</head>
<body>
    <div class="nav-bar">
        <a href="menu.html" class="nav-link">⬅️ Volver al Menú</a>
    </div>

    <div class="card">
        <h2>+ Registrar Nueva Red WI-FI</h2>
        <form id="formWifi">
            <label for="wifiCliente">Nombre del Cliente:</label>
            <input type="text" id="wifiCliente" placeholder="Ej. Gabriel Binomo" required>

            <label for="wifiSsid">Nombre WI-FI (SSID):</label>
            <input type="text" id="wifiSsid" placeholder="Ej. Telecentro-2.4G" required>
            
            <label for="wifiClave">Contraseña de la Red:</label>
            <input type="text" id="wifiClave" placeholder="Ej. 12345678" required>
            
            <label for="wifiLocalidad">Localidad:</label>
            <select id="wifiLocalidad" required>
                <option value="Pampa del Infierno">Pampa del Infierno</option>
                <option value="Bermejo">Bermejo</option>
                <option value="Los Frentones">Los Frentones</option>
                <option value="Río Muerto">Río Muerto</option>
                <option value="OTRA_NUEVA">+ Agregar otra localidad...</option>
            </select>

            <!-- Caja oculta que aparece solo si eligen agregar otra localidad -->
            <div id="cajaNuevaLocalidad" class="nueva-loc-box">
                <label for="wifiNuevaLocalidad" style="color: #00b0ff;">Escribe el nombre de la nueva localidad:</label>
                <input type="text" id="wifiNuevaLocalidad" placeholder="Ej. Concepción del Bermejo" style="margin-bottom: 0;">
            </div>

            <label for="wifiUbi">Dirección / Ubicación Física:</label>
            <input type="text" id="wifiUbi" placeholder="Ej. Calle 9 de Julio e / Chaco" required>

            <button type="submit">Guardar en la Nube</button>
        </form>
    </div>

    <script src="conexion.js"></script>
    <script>
        // Lógica visual para mostrar el input secreto si eligen "Agregar otra"
        document.getElementById('wifiLocalidad').addEventListener('change', function() {
            const caja = document.getElementById('cajaNuevaLocalidad');
            const inputNueva = document.getElementById('wifiNuevaLocalidad');
            if (this.value === 'OTRA_NUEVA') {
                caja.style.display = 'block';
                inputNueva.required = true;
                inputNueva.focus();
            } else {
                caja.style.display = 'none';
                inputNueva.required = false;
                inputNueva.value = "";
            }
        });
    </script>
</body>
</html>
