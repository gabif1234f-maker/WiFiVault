<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Agregar Red</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor-formulario">
                <!-- BARRA DE ENCABEZADO CON LOGO CYBERPUNK INTEGRADO -->
        <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: #141622; padding: 12px 20px; border-radius: 8px; border: 1px solid #1f2335;">
            <a href="menu.html" class="btn-volver" style="margin-bottom: 0;">← Volver al Menú</a>
            
            <div class="encabezado-logo-contenedor" style="display: flex; align-items: center; gap: 12px;">
                <div class="logo-cyber-nodo" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 100 100" xmlns="http://w3.org" style="width: 100%; height: 100%;">
                        <circle cx="50" cy="55" r="38" fill="none" stroke="rgba(255, 56, 56, 0.15)" stroke-width="2" stroke-dasharray="4 4" />
                        <path d="M25 38 A 30 30 0 0 1 75 38" fill="none" stroke="#ff3838" stroke-width="5" stroke-linecap="round" style="filter: drop-shadow(0 0 6px #ff3838);" />
                        <path d="M33 46 A 20 20 0 0 1 67 46" fill="none" stroke="#ff3838" stroke-width="5" stroke-linecap="round" style="filter: drop-shadow(0 0 6px #ff3838);" />
                        <line x1="50" y1="55" x2="50" y2="82" stroke="#787c99" stroke-width="3" stroke-linecap="round" opacity="0.8" />
                        <line x1="50" y1="68" x2="28" y2="78" stroke="#787c99" stroke-width="3" stroke-linecap="round" opacity="0.8" />
                        <line x1="50" y1="68" x2="72" y2="78" stroke="#787c99" stroke-width="3" stroke-linecap="round" opacity="0.8" />
                        <circle cx="50" cy="55" r="5" fill="#ffffff" style="filter: drop-shadow(0 0 8px #ff3838);" />
                        <circle cx="28" cy="78" r="4" fill="#ff3838" />
                        <circle cx="72" cy="78" r="4" fill="#ff3838" />
                        <circle cx="50" cy="82" r="4" fill="#ff3838" />
                    </svg>
                </div>
                <h2 style="margin-bottom: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; color: #ff3838; text-transform: uppercase;">Alta de Terminal</h2>
            </div>
        </div>

        <form id="formWifi">
            <div class="grupo-campo">
                <label for="wifiCliente">Nombre del Cliente:</label>
                <input type="text" id="wifiCliente" placeholder="Ej. Juan Pérez" required>
            </div>
            <div class="grupo-campo">
                <label for="wifiSsid">Nombre WI-FI (SSID):</label>
                <input type="text" id="wifiSsid" placeholder="Ej. TeleRed_Cliente" required>
            </div>
            <div class="grupo-campo">
                <label for="wifiClave">Contraseña de la Red:</label>
                <input type="text" id="wifiClave" placeholder="Escribe la clave de seguridad" required>
            </div>
            <div class="grupo-campo">
                <label for="wifiLocalidad">Localidad:</label>
                <select id="wifiLocalidad" required>
                    <option value="">-- Cargando localidades... --</option>
                </select>
            </div>
            <div class="grupo-campo">
                <label for="wifiBarrio">Barrio:</label>
                <select id="wifiBarrio" required>
                    <option value="">-- Primero selecciona una localidad --</option>
                </select>
            </div>
            <div class="grupo-campo">
                <label for="wifiCalle">Calle Principal:</label>
                <select id="wifiCalle">
                    <option value="">-- Primero selecciona un barrio --</option>
                </select>
            </div>
            <div class="grupo-campo">
                <label for="wifiEntreCalle1">Entre Calle (Esquina 1):</label>
                <select id="wifiEntreCalle1">
                    <option value="">-- Primero selecciona un barrio --</option>
                </select>
            </div>
            <div class="grupo-campo">
                <label for="wifiEntreCalle2">Y Calle (Esquina 2):</label>
                <select id="wifiEntreCalle2">
                    <option value="">-- Primero selecciona un barrio --</option>
                </select>
            </div>
            
            <div style="background: #1a1d2e; padding: 15px; border-radius: 8px; border: 1px solid #24293e; margin-bottom: 20px;">
                <label style="color: #2ed573; font-weight: bold; font-size: 13px; display: block; margin-bottom: 10px;">🛰️ Geolocalización Satelital (Editable)</label>
                <button type="button" id="btnCapturarGps" class="menu-btn" style="background: #2ed573; margin-bottom: 12px; padding: 10px;">📍 Capturar Mi Ubicación Actual</button>
                <div style="display: flex; gap: 10px;">
                    <div class="grupo-campo" style="flex: 1; margin-bottom: 0;"><label>Latitud:</label><input type="number" id="wifiLatitud" step="any" placeholder="Ej. -26.5051"></div>
                    <div class="grupo-campo" style="flex: 1; margin-bottom: 0;"><label>Longitud:</label><input type="number" id="wifiLongitud" step="any" placeholder="Ej. -61.1744"></div>
                </div>
            </div>
            <button type="submit" class="btn-enviar">Guardar en la Nube ☁️</button>
        </form>
    </div>
    <script src="conexion.js"></script>
</body>
</html>
