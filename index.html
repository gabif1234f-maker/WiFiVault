<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Iniciar Sesión</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #1e1e24; color: #ffffff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background-color: #2a2a35; padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { color: #00b0ff; text-align: center; margin-bottom: 25px; }
        label { display: block; margin-bottom: 6px; color: #bbbbbb; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #444455; border-radius: 8px; background-color: #1f1f26; color: #ffffff; font-size: 15px; }
        input:focus { border-color: #00b0ff; outline: none; }
        button { background-color: #00b0ff; color: #1e1e24; border: none; padding: 12px; width: 100%; cursor: pointer; border-radius: 8px; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0081cb; color: white; }
        .link-text { text-align: center; margin-top: 15px; font-size: 14px; color: #aaaaaa; }
        .link-text a { color: #00b0ff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Iniciar Sesión</h2>
        <form id="formLogin">
            <label for="loginCorreo">Correo Electrónico:</label>
            <input type="email" id="loginCorreo" required placeholder="tu@correo.com">

            <label for="loginClave">Contraseña Web:</label>
            <input type="password" id="loginClave" required placeholder="******">

            <button type="submit">Ingresar al Gestor</button>
        </form>
        <p class="link-text">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
    <script src="conexion.js"></script>
</body>
</html>
