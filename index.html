<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFiVault - Formulario de Prueba</title>
    <!-- Conector Oficial de Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; padding: 40px; text-align: center; }
        .box { background-color: #1e293b; max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        .input-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 15px; }
        label { font-size: 13px; color: #94a3b8; font-weight: bold; margin-bottom: 5px; }
        input { padding: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #10b981; border: none; color: #0f172a; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; font-size: 15px; }
        button:hover { background: #059669; color: white; }
        a { color: #38bdf8; text-decoration: none; display: inline-block; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚀 WiFiVault - Enviar Datos</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 25px;">Formulario básico de testeo de conexión en la nube.</p>
        
        <form id="testForm">
            <div class="input-group">
                <label>Nombre del Cliente</label>
                <input type="text" id="valCliente" placeholder="Ej. Farmacia Pampa" required>
            </div>
            
            <div class="input-group">
                <label>Dirección y Barrio</label>
                <input type="text" id="valDireccion" placeholder="Ej. Av. 25 de Mayo 450 (B° Centro)" required>
            </div>
            
            <div class="input-group">
                <label>Contraseña WiFi / Red (SSID)</label>
                <input type="text" id="valPassword" placeholder="Ej. Red: WiFi_Casa - Clave: P@ssw0rd!" required>
            </div>
            
            <button type="submit">Enviar a Base de Datos</button>
        </form>

        <a href="registros.html">📋 Ver Registros Guardados →</a>
    </div>

    <script>
        // Enlace directo a tu proyecto actual de las capturas
        const URL_SUPABASE = "https://uwefwdfjfnoknkkobnzn.supabase.co";
        const KEY_SUPABASE = "sb_publishable_XXjNw0LJ7HroXlhobY3vTg_l3ofqWMa";
        const clienteSupabase = supabase.createClient(URL_SUPABASE, KEY_SUPABASE);

        document.getElementById("testForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const txtNombre = document.getElementById("valCliente").value.trim();
            const txtDireccion = document.getElementById("valDireccion").value.trim();
            const txtPassword = document.getElementById("valPassword").value.trim();

            try {
                // Envío directo respetando las columnas creadas en tu SQL Editor
                const { error } = await clienteSupabase.from('redes_wifi').insert([
                    { 
                        nombre: txtNombre, 
                        ubicacion: txtDireccion, 
                        barrio: "Manual", // Campo por defecto para evitar errores de restricción
                        red: "WiFi",      // Campo por defecto para testeo básico
                        password: txtPassword 
                    }
                ]);

                if (error) {
                    alert("Error en el servidor: " + error.message);
                } else {
                    alert("¡Éxito! Datos guardados en la nube.");
                    document.getElementById("testForm").reset();
                    window.location.href = "registros.html";
                }
            } catch (err) {
                alert("Error de conexión externa.");
            }
        });
    </script>
</body>
</html>
