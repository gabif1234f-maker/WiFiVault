<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WI-FI Gestor - Iniciar Sesión</title>
    <style>
          * { box-sizing: border-box; }
    body { 
        font-family: 'Segoe UI', sans-serif; 
        background-color: #0d0e15; /* Fondo idéntico al resto del sistema */
        color: #ffffff; 
        margin: 0; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
    }
    .card { 
        background-color: #141622; /* Panel gris azulado espacial */
        padding: 30px; 
        border-radius: 12px; 
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
        width: 100%; 
        max-width: 400px; 
        border: 1px solid #1f2335; 
    }
    label { display: block; margin-bottom: 6px; font-color: #787c99; font-size: 13px; font-weight: 600; color: #787c99; }
    input { 
        width: 100%; 
        padding: 12px 14px; 
        margin-bottom: 20px; 
        background: #1a1d2e; 
        border: 1px solid #24293e; 
        border-radius: 6px; 
        color: white; 
        font-size: 14px; 
        outline: none; 
    }
    input:focus { border-color: #ff3838; box-shadow: 0 0 8px rgba(255, 56, 56, 0.2); }
    button { 
        background-color: #ff3838; /* Rojo carmesí unificado */
        color: #ffffff; 
        border: none; 
        padding: 12px; 
        width: 100%; 
        border-radius: 6px; 
        font-weight: bold; 
        font-size: 14px; 
        cursor: pointer; 
        transition: background 0.2s; 
    }
    button:hover { background-color: #cf2121; }
    .link-text { text-align: center; margin-top: 15px; font-size: 13px; color: #787c99; }
    .link-text a { color: #ff3838; text-decoration: none; font-weight: bold; }
    .link-text a:hover { text-decoration: underline; }

    </style>
</head>
<body>
    <div class="card">
                <!-- LOGO DE SEGURIDAD Y TÍTULO UNIFICADO -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px; text-align: center; width: 100%;">
            
            <!-- ISOTIPO: CANDADO DE RED CYBERPUNK NATIVO -->
            <div class="logo-cyber-seguridad" style="width: 65px; height: 65px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 100 100" xmlns="http://w3.org" style="width: 100%; height: 100%;">
                    <path d="M30 45 V 30 A 20 20 0 0 1 70 30 V 45" fill="none" stroke="#787c99" stroke-width="5" stroke-linecap="round" opacity="0.6" />
                    <polygon points="20,45 80,45 75,85 50,95 25,85" fill="#1a1d2e" stroke="#ff3838" stroke-width="4.5" style="filter: drop-shadow(0 0 8px rgba(255, 56, 56, 0.4));" />
                    <path d="M38 58 A 15 15 0 0 1 62 58" fill="none" stroke="#ff3838" stroke-width="3.5" stroke-linecap="round" class="onda-segura" />
                    <path d="M44 65 A 8 8 0 0 1 56 65" fill="none" stroke="#ff3838" stroke-width="3.5" stroke-linecap="round" class="onda-segura" />
                    <circle cx="50" cy="74" r="4.5" fill="#ffffff" style="filter: drop-shadow(0 0 6px #ff3838);" />
                </svg>
            </div>

            <!-- TÍTULO DE BIENVENIDA -->
            <h1 style="color: #ff3838; font-size: 24px; font-weight: 700; letter-spacing: 1.5px; margin: 0; text-transform: uppercase; text-shadow: 0 0 10px rgba(255, 56, 56, 0.2);">
                WI-FI GESTOR
            </h1>
            <p style="color: #787c99; font-size: 12px; margin-top: 6px; margin-bottom: 0; letter-spacing: 0.5px;">Autenticación de Terminal Requerida</p>
        </div>

        <form id="formLogin">
            <label for="loginCorreo">Correo Electrónico:</label>
            <input type="email" id="loginCorreo" required placeholder="tu@correo.com">

            <label for="loginClave">Contraseña Web:</label>
            <input type="password" id="loginClave" required placeholder="******">

            <button type="submit">Ingresar al Gestor</button>
        </form>
        <p class="link-text">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    </div>
    <script src="conexion.js"></script>
</body>
</html>
