<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFiVault - Registro Seguro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <!-- Barra de navegación superior -->
        <div class="top-nav">
            <div class="nav-brand">
                <span class="brand-icon">⚡</span>
                <h1>WiFi<strong>Vault</strong></h1>
            </div>
            <a href="registros.html" class="btn-nav">
                <span>📋</span> Gestionar Base de Datos
            </a>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="main-card">
            <div class="card-header">
                <h2>Registrar Nueva Conexión</h2>
                <p>Ingresa las credenciales y la ubicación del cliente de forma centralizada.</p>
            </div>
            
            <form id="wifiForm" class="modern-form">
                
                <!-- SECCIÓN: DATOS DEL CLIENTE -->
                <div class="form-section">
                    <h3 class="section-title">Datos del Cliente</h3>
                    
                    <div class="form-group">
                        <label for="nombreCliente">Nombre Completo o Razón Social</label>
                        <input type="text" id="nombreCliente" placeholder="Ej. Juan Carlos Pérez o Farmacia Pampa" required>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="localidad">Localidad</label>
                            <select id="localidad" required>
                                <option value="Pampa del Infierno, Chaco" selected>Pampa del Infierno, Chaco</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="barrioSelect">Barrio</label>
                            <select id="barrioSelect" required>
                                <option value="" disabled selected>Selecciona un barrio...</option>
                                <option value="Centro">Barrio Centro</option>
                                <option value="Aviación">Barrio Aviación</option>
                                <option value="San Cayetano">Barrio San Cayetano</option>
                                <option value="Primavera">Barrio Primavera</option>
                                <option value="NUEVO_BARRIO">➕ Agregar Nuevo Barrio...</option>
                            </select>
                            <input type="text" id="barrioManual" placeholder="Escribe el nombre del barrio..." style="display: none; margin-top: 8px;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="direccion">Dirección (Calle y Altura / Número de casa)</label>
                        <input type="text" id="direccion" placeholder="Ej. Av. 25 de Mayo 450 o Calle Sarmiento S/N" required>
                    </div>
                </div>

                <!-- SECCIÓN: CONFIGURACIÓN DE RED -->
                <div class="form-section">
                    <h3 class="section-title">Configuración de Conexión</h3>
                    
                    <div class="form-group">
                        <label for="nombreRed">Nombre de la Red (SSID)</label>
                        <input type="text" id="nombreRed" placeholder="Ej. WiFi_Casa_Perez" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña de Red WiFi</label>
                        <input type="text" id="password" class="password-field" placeholder="Ej. P@ssw0rd2026!" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Almacenar Credenciales en Servidor</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCd5mbGW3sbeV2Cp3vjeVwiiD2QzvSymjo",
            authDomain: "://firebaseapp.com",
            projectId: "wi-fi-dcfd6",
            storageBucket: "://appspot.com",
            messagingSenderId: "903524317999",
            appId: "1:903524317999:web:11867a826e078b5a077fda",
            measurementId: "G-8417484NY2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const selectBarrio = document.getElementById("barrioSelect");
        const inputBarrioManual = document.getElementById("barrioManual");
        selectBarrio.addEventListener("change", function() {
            if (this.value === "NUEVO_BARRIO") {
                inputBarrioManual.style.display = "block";
                inputBarrioManual.required = true;
                inputBarrioManual.value = "";
                inputBarrioManual.focus();
            } else {
                inputBarrioManual.style.display = "none";
                inputBarrioManual.required = false;
            }
        });

        document.getElementById("wifiForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            var barrioFinal = selectBarrio.value === "NUEVO_BARRIO" ? inputBarrioManual.value.trim() : selectBarrio.value;
            var direccionTxt = document.getElementById("direccion").value.trim();
            var localidadTxt = document.getElementById("localidad").value;
            var direccionCompleta = direccionTxt + " (B° " + barrioFinal + "), " + localidadTxt;
            
            try {
                await addDoc(collection(db, "redes_wifi"), {
                    nombre: document.getElementById("nombreCliente").value.trim(),
                    ubicacion: direccionCompleta,
                    barrio: barrioFinal,
                    red: document.getElementById("nombreRed").value.trim(),
                    password: document.getElementById("password").value
                });
                
                alert("¡Registro guardado exitosamente en la nube!");
                document.getElementById("wifiForm").reset();
                window.location.href = "registros.html";
            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Error al conectar con la base de datos.");
            }
        });
    </script>
</body>
</html>
